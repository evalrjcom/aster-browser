[package]
name = "aster-browser"
version = "0.1.0"
edition = "2021"

[dependencies]
fltk = { version = "1.5", features = ["fltk-bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2", "gzip", "brotli", "deflate", "charset", "multipart"] }
url = "2.5"
scraper = "0.23"
